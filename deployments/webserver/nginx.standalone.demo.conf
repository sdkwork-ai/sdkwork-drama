# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/drama/webserver.pid;
error_log /var/log/sdkwork/drama/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name drama-demo.sdkwork.com drama-demo.birdcoder.com drama-demo.dtupay.com drama-demo.noaper.com drama-demo.sdkwork.cn drama-demo.birdcoder.cn drama-demo.dtupay.cn drama-demo.noaper.cn drama-demo.skubc.com drama-demo.skubc.cn drama-demo.zowalk.com drama-demo.zowalk.cn drama-demo.offer86.com drama-demo.offer86.cn drama-demo.86offer.com drama-demo.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
