# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/drama/webserver.pid;
error_log /var/log/sdkwork/drama/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name drama-test.sdkwork.com drama-test.birdcoder.com drama-test.dtupay.com drama-test.noaper.com drama-test.sdkwork.cn drama-test.birdcoder.cn drama-test.dtupay.cn drama-test.noaper.cn drama-test.skubc.com drama-test.skubc.cn drama-test.zowalk.com drama-test.zowalk.cn drama-test.offer86.com drama-test.offer86.cn drama-test.86offer.com drama-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
