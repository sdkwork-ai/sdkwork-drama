[workspace]
resolver = "2"
members = [
    "crates/sdkwork-routes-drama-app-api",
    "crates/sdkwork-drama-episode-service",
    "crates/sdkwork-drama-episode-repository-sqlx",
    "crates/sdkwork-drama-media-service",
    "crates/sdkwork-drama-media-drive",
    "crates/sdkwork-drama-media-repository-sqlx",
    "crates/sdkwork-drama-database-host",
    "crates/sdkwork-api-drama-assembly",
    "crates/sdkwork-api-drama-standalone-gateway",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
repository = "https://sdkwork.com/sdkwork/sdkwork-drama"

[workspace.dependencies]
# Internal sibling crates (path-only; consumers reference via `workspace = true`)
sdkwork-routes-drama-app-api = { path = "crates/sdkwork-routes-drama-app-api" }
sdkwork-drama-episode-service = { path = "crates/sdkwork-drama-episode-service" }
sdkwork-drama-episode-repository-sqlx = { path = "crates/sdkwork-drama-episode-repository-sqlx" }
sdkwork-drama-media-service = { path = "crates/sdkwork-drama-media-service" }
sdkwork-drama-media-drive = { path = "crates/sdkwork-drama-media-drive" }
sdkwork-drama-media-repository-sqlx = { path = "crates/sdkwork-drama-media-repository-sqlx" }
sdkwork-drama-database-host = { path = "crates/sdkwork-drama-database-host" }
sdkwork-api-drama-assembly = { path = "crates/sdkwork-api-drama-assembly" }

# SDKWork web framework (sibling sub-crate path protocol per DEPENDENCY_MANAGEMENT_SPEC)
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-store-sqlx = { path = "../sdkwork-web-framework/crates/sdkwork-web-store-sqlx", default-features = false, features = ["postgres"] }
sdkwork-webstore-database-host = { path = "../sdkwork-web-framework/crates/sdkwork-webstore-database-host" }

# IAM web adapter: dual-token context resolution + authorization for app-api
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }

# Unified database framework (pool, lifecycle, repository infrastructure, id generation)
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle" }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id" }

# Cross-language shared utils (envelope, result codes, pagination, datetime, crypto)
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }

# Drive integration: all file uploads flow through sdkwork-drive (embedded crates)
sdkwork-drive-uploader-service = { path = "../sdkwork-drive/crates/sdkwork-drive-uploader-service" }
sdkwork-drive-object-runtime = { path = "../sdkwork-drive/crates/sdkwork-drive-object-runtime" }
sdkwork-drive-workspace-service = { path = "../sdkwork-drive/crates/sdkwork-drive-workspace-service" }
sdkwork-drive-storage-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-storage-contract" }

# External dependencies (single source of truth for the whole workspace)
axum = "0.8.8"
tokio = { version = "1.48.0", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2.0"
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
